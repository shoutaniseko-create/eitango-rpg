<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="theme-color" content="#000">
<link rel="icon" href="data:,"><title>英単語クエスト 〜ことばの勇者〜</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:#000;color:#fff;overflow:hidden;font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","DotGothic16",sans-serif;touch-action:manipulation}
#wrap{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start}
#box{position:relative;width:min(100vw,calc(100vh*4/3));aspect-ratio:4/3;max-height:100vh;background:#000;--u:calc(min(100vw,calc(100vh*4/3))/100)}
@media (orientation:portrait){#box{width:100vw;--u:1vw}}
#cv{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
#ui{position:absolute;inset:0;font-size:calc(var(--u)*3.1);pointer-events:none}#ui>*{pointer-events:auto}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;z-index:50}
#place{position:absolute;top:8%;left:50%;transform:translateX(-50%);font-size:calc(var(--u)*3.6);background:#000a;border:2px solid #fff;border-radius:8px;padding:.3em 1em;opacity:0;transition:opacity .6s;pointer-events:none;white-space:nowrap}
#hud{position:absolute;left:1.5%;top:2%;font-size:calc(var(--u)*2.3);line-height:1.35;background:#000c;border:2px solid #fff;border-radius:6px;padding:.3em .6em;pointer-events:none}
.win{position:absolute;background:#000;border:3px solid #fff;border-radius:8px;box-shadow:0 0 0 2px #000,inset 0 0 0 1px #000;padding:.6em .9em;line-height:1.6}
.msg{left:3%;right:3%;bottom:3%;min-height:28%;font-size:1.05em;cursor:pointer;z-index:10}
.msg .arrow{position:absolute;bottom:.3em;left:50%;font-style:normal;animation:bl .6s steps(2) infinite}@keyframes bl{50%{opacity:0}}
.menu{right:4%;top:6%;min-width:34%;max-height:84%;overflow-y:auto;z-index:20;-webkit-overflow-scrolling:touch}
.menu .mt{text-align:center;border-bottom:2px solid #fff;margin:-.2em -.4em .3em;padding-bottom:.2em;font-size:.9em}
.ml.c2{display:grid;grid-template-columns:1fr 1fr;column-gap:1.2em}
.mi{display:flex;align-items:baseline;gap:.3em;padding:.25em .2em;cursor:pointer;min-height:2.1em;border-radius:4px}.mi b{visibility:hidden;color:#fff;font-size:.8em}.mi.cur b{visibility:visible;animation:bl .8s steps(2) infinite}
.mi small{margin-left:auto;padding-left:.8em;color:#cde;font-size:.75em;white-space:nowrap}.mi.dis{color:#777}.mi:active{background:#335}
.menu.yn{right:6%;bottom:34%;top:auto;min-width:18%}
.menu.fmenu{left:4%;right:auto;top:4%;min-width:40%}
.menu.bcmd{left:3%;right:51.5%;top:auto;bottom:3%;min-width:0;font-size:1em;white-space:nowrap}
.menu.bsub,.menu.items,.menu.shop,.menu.set,.menu.days,.menu.pmenu{right:3%;top:4%;max-width:62%}.menu.shop{max-height:62%}
.menu.slots{left:5%;right:5%;top:22%}.menu.slots .mi small{white-space:normal}
.menu.tmenu{left:34%;right:34%;top:auto;bottom:10%;min-width:0;text-align:center;font-size:1.2em}
.titlebox{left:8%;right:8%;top:6%;text-align:center;background:none;border:none;box-shadow:none}
.titlebox h1{margin:0;font-size:2.6em;color:#ffe060;text-shadow:3px 3px 0 #a03000,0 0 18px #f80;letter-spacing:.08em}.titlebox h2{margin:.2em 0;font-size:1.3em;color:#fff;text-shadow:2px 2px 0 #024}
#bstat{left:3%;top:3%;min-width:26%;font-size:.95em;line-height:1.35}#bstat .hn{border-bottom:2px solid #fff;margin-bottom:.2em}#bstat .low{color:#ff8a30}#bstat .ps{color:#9ef;font-size:.85em}
#bstat.hurt{animation:hurt .4s}@keyframes hurt{0%,100%{transform:none}25%{transform:translate(-6px,3px);border-color:#f44}75%{transform:translate(6px,-3px)}}
.blog{left:50%;right:3%;bottom:3%;min-height:28%;font-size:.95em}
.qpanel{left:3%;right:3%;bottom:2%;padding:.4em .8em;z-index:30;text-align:center;font-size:1.05em}.qpanel.top{top:3%;bottom:auto}
.qt{font-size:.8em;color:#fd6;margin-bottom:.2em}.qw{font-size:1.4em;font-weight:bold;letter-spacing:.04em}.qw.big{font-size:1.7em;line-height:1.2}.qm{color:#9f9;font-size:1.1em}.qm.big{color:#fff;font-size:1.6em}
.qh{color:#fd6;letter-spacing:.25em;margin:.2em 0;font-size:1.2em}
.qch{display:grid;grid-template-columns:1fr 1fr;gap:.4em;margin-top:.4em}
.qpanel button{font:inherit;font-size:.95em;color:#fff;background:#111;border:2px solid #fff;border-radius:8px;padding:.35em .3em;min-height:2.5em;cursor:pointer}
.qpanel button.cur{background:#2a3a8a}.qpanel button:active{background:#46c}
.qpanel input{font-size:max(16px,1.5em);width:80%;padding:.3em;border-radius:6px;border:2px solid #8af;text-align:center;-webkit-user-select:text;user-select:text;background:#fff;color:#000}
.qb{display:flex;gap:.6em;justify-content:center;margin-top:.5em}.qb button{min-width:30%}
.qres{font-size:1.4em;font-weight:bold}.qres.ok{color:#ff6}.qres.ng{color:#f77}.qy{color:#f99;font-size:.85em}.qe{font-size:.8em;color:#cde;margin-top:.3em}.qe span{color:#aab}.qc{font-size:.8em;color:#fd8}.qn{font-size:.7em;color:#888;margin-top:.3em}
.credits{position:absolute;inset:6% 10%;text-align:center;background:#000c;border:3px solid #fff;border-radius:10px;padding:1em;z-index:40;overflow:auto}.credits h2{color:#ffe060}.credits .sm{color:#aaa;font-size:.8em}
/* controls */
#ctrl{position:fixed;left:0;right:0;bottom:0;height:0;pointer-events:none;z-index:60}
#dpad{position:fixed;left:calc(18px + env(safe-area-inset-left));bottom:calc(18px + env(safe-area-inset-bottom));width:min(34vmin,200px);height:min(34vmin,200px);pointer-events:auto;touch-action:none;opacity:.75}
#dpad::before,#dpad::after{content:'';position:absolute;background:#333c;border:3px solid #fffa;border-radius:10px}
#dpad::before{left:33%;right:33%;top:0;bottom:0}#dpad::after{top:33%;bottom:33%;left:0;right:0}
#dpad i{position:absolute;z-index:2;width:0;height:0;border:min(3.2vmin,18px) solid transparent}
#dpad .u{left:50%;top:6%;transform:translateX(-50%);border-bottom-color:#fff;border-top:0}#dpad .d{left:50%;bottom:6%;transform:translateX(-50%);border-top-color:#fff;border-bottom:0}
#dpad .l{top:50%;left:6%;transform:translateY(-50%);border-right-color:#fff;border-left:0}#dpad .r{top:50%;right:6%;transform:translateY(-50%);border-left-color:#fff;border-right:0}
#dpad[data-d=up] .u{border-bottom-color:#ff0}#dpad[data-d=down] .d{border-top-color:#ff0}#dpad[data-d=left] .l{border-right-color:#ff0}#dpad[data-d=right] .r{border-left-color:#ff0}
.btn{position:fixed;width:min(17vmin,96px);height:min(17vmin,96px);border-radius:50%;border:3px solid #fffa;background:#a22c;color:#fff;font:bold min(7vmin,40px)/1 sans-serif;display:flex;align-items:center;justify-content:center;pointer-events:auto;touch-action:none;opacity:.8}
#ba{right:calc(20px + env(safe-area-inset-right));bottom:calc(min(17vmin,96px) + 34px)}#bb{right:calc(min(17vmin,96px) + 44px + env(safe-area-inset-right));bottom:calc(20px + env(safe-area-inset-bottom));background:#228c}
.btn.on{background:#ff0;color:#000}
#start{position:fixed;inset:0;z-index:100;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:24px;cursor:pointer;text-align:center}
#start b{font-size:40px;color:#ffe060;margin-bottom:12px}#start span{animation:bl 1s steps(2) infinite;margin-top:24px}
#ver{position:fixed;bottom:4px;left:50%;transform:translateX(-50%);font-size:11px;color:#888;z-index:101;pointer-events:none}
.qs{font-size:1.1em;line-height:1.5}.qs u{color:#fd6;text-decoration:none;border-bottom:2px solid #fd6}.qsj{font-size:.8em;color:#aab}
.tbar{height:.5em;background:#333;border-radius:4px;overflow:hidden;margin:.2em 10%}.tbar i{display:block;height:100%;width:100%;background:#4f8;transition:width .1s linear}
#bgrp{right:3%;top:3%;font-size:.75em;line-height:1.35;max-width:40%;text-align:right;color:#cde}#bgrp b{color:#fd6}#bgrp small{color:#999}
.dex{inset:2%;z-index:40;display:flex;flex-direction:column;padding:.5em}.dh{display:flex;align-items:center;gap:.8em;border-bottom:2px solid #fff;padding-bottom:.3em}.dh span{font-size:.8em;color:#cde;flex:1}
.dh button,.dexd button{font:inherit;color:#fff;background:#228;border:2px solid #fff;border-radius:6px;padding:.2em .8em}.dr{font-size:.7em;color:#888;margin:.2em 0}.dr .got{color:#fd6}
.dg{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(13%,1fr));gap:.3em;-webkit-overflow-scrolling:touch}.dc{background:#112;border:1px solid #446;border-radius:6px;text-align:center;font-size:.6em;padding:.2em;cursor:pointer}
.dc canvas{display:block;aspect-ratio:1}.dc.un{color:#555}.dc.boss{border-color:#c84}.dc.rare{border-color:#8cf}
.dexd{left:8%;right:8%;top:8%;z-index:45}.dt{border-bottom:2px solid #fff;margin-bottom:.3em}.dd{display:flex;gap:.8em}.dimg{width:30%;background:#223;border-radius:8px}.dinfo{flex:1;font-size:.85em;line-height:1.5}.ddesc{margin-top:.4em;font-size:.9em;color:#eed}
.mbar{height:.5em;background:#333;border-radius:4px;overflow:hidden}.mbar i{display:block;height:100%;background:#fd6}
@media (hover:hover) and (pointer:fine){#dpad,.btn{opacity:.35}}
</style></head><body>
<div id="wrap"><div id="box"><canvas id="cv"></canvas><div id="hud" style="display:none"></div><div id="place"></div><div id="ui"></div><div id="fade"></div></div></div>
<div id="ctrl"><div id="dpad"><i class="u"></i><i class="d"></i><i class="l"></i><i class="r"></i></div><div class="btn" id="ba">A</div><div class="btn" id="bb">B</div></div>
<div id="start"><b>英単語クエスト</b>〜ことばの勇者〜<span>▶ タップしてスタート</span><small style="margin-top:30px;font-size:14px;color:#aaa">十字キーで移動／A：しらべる・はなす・けってい／B：メニュー・キャンセル<br>キーボード：矢印キー・Z(A)・X(B)<br><a href="classic.html" style="color:#8af" onclick="event.stopPropagation()">前のバトル版（クラシック）はこちら</a></small></div>
<div id="ver"></div>
<script src="js/audio.js"></script><script src="js/data.js"></script><script src="js/data2.js"></script><script src="js/engine.js"></script><script src="js/battle.js"></script><script src="js/main.js"></script>
</body></html>
